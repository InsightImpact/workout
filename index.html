<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="운동 기록">
<meta name="theme-color" content="#3d6bff">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%233d6bff'/%3E%3Ctext x='90' y='128' font-size='96' text-anchor='middle'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E">
<title>운동 기록</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fa;
    --card: #ffffff;
    --card2: #eef0f5;
    --border: #e2e5ec;
    --text: #1c2130;
    --sub: #7a8095;
    --accent: #3d6bff;
    --accent2: #2f56d6;
    --green: #1fae66;
    --red: #e4494f;
    --orange: #f09a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
    max-width: 560px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 14px calc(150px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 18px; padding: 8px 4px 14px; display: flex; align-items: center; justify-content: space-between; }
  h1 .tools { display: flex; gap: 6px; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; color: var(--text); background: var(--card2); font-size: 14px; }
  button:active { opacity: .7; }
  .icon-btn { padding: 6px 10px; font-size: 13px; color: var(--sub); }
  .advice-btn { padding: 6px 12px; font-size: 13px; background: var(--accent); color: #fff; font-weight: 600; }

  .cal { background: var(--card); border-radius: 16px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(20,30,60,.05); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .title { font-weight: 700; font-size: 16px; }
  .cal-head button { width: 34px; height: 34px; font-size: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dow { text-align: center; font-size: 11px; color: var(--sub); padding: 4px 0 8px; }
  .dow.sun { color: var(--red); } .dow.sat { color: var(--accent); }
  .day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 14px; background: transparent; position: relative; color: var(--text);
  }
  .day.other { color: #c2c7d4; }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .day.sel { background: var(--accent); color: #fff; font-weight: 700; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; position: absolute; bottom: 5px; }
  .day.done-all .dot { background: var(--green); }
  .day.done-part .dot { background: var(--orange); }
  .day.sel .dot { background: #fff; }

  .day-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 10px; }
  .day-head .d { font-size: 16px; font-weight: 700; }
  .day-head .actions { display: flex; gap: 6px; }
  .day-head .actions button { padding: 7px 12px; font-size: 13px; }
  .btn-copy { color: var(--accent2); }
  .btn-del { color: var(--red); }

  .exercise { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(20,30,60,.05); }
  .ex-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 6px; }
  .ex-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); padding: 4px 0; }
  .ex-name:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .ex-tools { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
  .ex-tools button {
    min-width: 40px; height: 40px; padding: 0; font-size: 18px; line-height: 1;
    color: var(--sub); background: var(--card2); border-radius: 10px;
  }
  .ex-tools button.rest-badge { min-width: auto; height: auto; font-size: 12px; }
  .rest-badge { font-size: 12px; color: var(--sub); background: var(--card2); border-radius: 8px; padding: 5px 8px; white-space: nowrap; }

  table.sets { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .sets th { font-size: 11px; color: var(--sub); font-weight: 500; padding: 4px 2px; text-align: center; }
  .sets td { padding: 3px 2px; text-align: center; }
  .sets tr.done-row td { opacity: .5; }
  .set-num { font-size: 13px; color: var(--sub); width: 36px; }
  .sets input[type=number] {
    width: 100%; max-width: 76px; background: var(--card2); border: 1px solid transparent; border-radius: 8px;
    color: var(--text); font-size: 15px; text-align: center; padding: 8px 2px; font-family: inherit;
  }
  .sets input[type=number]:focus { outline: none; border-color: var(--accent); background: #fff; }
  .chk {
    width: 34px; height: 34px; border-radius: 9px; background: var(--card2); font-size: 15px; color: var(--sub);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .chk.on { background: var(--green); color: #fff; }
  .set-actions { display: flex; gap: 8px; margin-top: 10px; }
  .set-actions button { flex: 1; padding: 11px 4px; font-size: 13px; font-weight: 600; background: var(--card2); }
  .hist-btn { color: var(--accent2); }
  .form-btn { color: #c2410c; }
  .hist-best { background: var(--card2); border-radius: 10px; padding: 11px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
  .hist-best b { color: var(--accent2); }
  .hist-item { border-top: 1px solid var(--border); padding: 12px 0; }
  .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .hist-date { font-weight: 700; font-size: 14px; }
  .hist-meta { font-size: 11px; color: var(--sub); font-weight: 400; margin-left: 6px; }
  .hist-load { padding: 7px 11px; font-size: 12px; font-weight: 600; color: var(--accent2); background: var(--card2); flex-shrink: 0; }
  .hist-sets { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .hist-sets .up { color: var(--green); font-weight: 600; }
  .add-set { color: var(--accent2); }
  .del-set { color: var(--red); }
  .set-actions button:disabled { opacity: .35; }

  .finish-btn {
    width: 100%; margin-top: 14px; padding: 17px; font-size: 16px; font-weight: 700;
    background: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(31,174,102,.28);
  }
  .finish-btn.done { background: var(--card2); color: var(--sub); box-shadow: none; font-weight: 600; }
  .menu-list button { width: 100%; text-align: left; padding: 15px 14px; font-size: 15px; background: var(--card2); margin-bottom: 8px; }
  .finish-stat { display: flex; gap: 8px; margin: 4px 0 12px; }
  .finish-stat div { flex: 1; background: var(--card2); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .finish-stat .n { font-size: 20px; font-weight: 800; color: var(--text); }
  .finish-stat .l { font-size: 11px; color: var(--sub); margin-top: 3px; }

  .add-ex { width: 100%; padding: 14px; border: 1.5px dashed #c9cedb; border-radius: 16px; background: transparent; color: var(--accent2); font-size: 14px; font-weight: 600; }
  .tpl-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .tpl-row button { flex: 1; padding: 12px 6px; font-size: 13px; font-weight: 600; background: var(--card); border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(20,30,60,.05); }
  .tpl-row button .sub { display: block; font-size: 11px; font-weight: 400; color: var(--sub); margin-top: 3px; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 26px 0 10px; line-height: 1.6; }

  #timerbar {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    background: var(--accent); color: #fff;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    border-radius: 18px 18px 0 0; box-shadow: 0 -4px 24px rgba(20,30,60,.25); z-index: 50;
  }
  #timerbar.show { display: flex; }
  #timerbar.rest-done { background: var(--green); }
  #timerbar.rest-done .t { font-size: 24px; }
  #timerbar .t { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; }
  #timerbar .lbl { font-size: 12px; opacity: .9; }
  #timerbar button { background: rgba(255,255,255,.22); color: #fff; padding: 9px 12px; font-size: 13px; font-weight: 600; }
  #timerbar .prog { position: absolute; top: 0; left: 0; height: 3px; background: rgba(255,255,255,.95); border-radius: 3px; transition: width 1s linear; }

  .modal-bg { position: fixed; inset: 0; background: rgba(25,30,45,.45); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 18px 24px; border: 1px solid var(--border); max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-size: 16px; margin-bottom: 14px; }
  .modal .row { display: flex; gap: 8px; margin-top: 14px; }
  .modal .row button { flex: 1; padding: 13px; font-size: 15px; font-weight: 600; }
  .modal .primary { background: var(--accent); color: #fff; }
  .modal input[type=date], .modal input[type=text] {
    width: 100%; padding: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 15px; font-family: inherit;
  }
  .preset-list { margin-top: 12px; max-height: 46vh; overflow-y: auto; }
  .preset-group { font-size: 12px; font-weight: 700; color: var(--sub); margin: 12px 2px 6px; }
  .preset-group:first-child { margin-top: 2px; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-list button { padding: 9px 12px; font-size: 13px; background: var(--card2); }
  .rest-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .rest-opts button { padding: 10px 14px; font-size: 14px; }
  .rest-opts button.cur { background: var(--accent); color: #fff; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }

  #storage-warn {
    display: none; background: #fff4e5; border: 1px solid #f0c48a; color: #7a4a10;
    border-radius: 12px; padding: 11px 13px; font-size: 12.5px; line-height: 1.55; margin-bottom: 10px;
  }
  #storage-warn.show { display: block; }
  #update-bar {
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 14px;
    font-size: 13.5px; font-weight: 600; margin-bottom: 10px;
  }
  #update-bar.show { display: flex; }
  #update-bar button { background: rgba(255,255,255,.25); color: #fff; padding: 8px 12px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  #storage-warn b { color: #b2600a; }
  #ver-bar {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    margin: 18px 0 calc(14px + env(safe-area-inset-bottom));
    font-size: 11.5px; color: var(--muted); letter-spacing: .2px;
    cursor: pointer; user-select: none; padding: 8px;
  }
  #ver-bar:active { opacity: .5; }
  #ver-txt { font-variant-numeric: tabular-nums; font-weight: 600; }
  #ver-state { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: #eceff3; }
  #ver-state.ok  { background: #e3f5e8; color: #1c7a3d; }
  #ver-state.new { background: #ffe9e3; color: #c23c14; font-weight: 700; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom));
    background: #1c2130; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px;
    z-index: 200; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: .95; }

  #advice-body { font-size: 14px; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  #advice-body.loading { color: var(--sub); text-align: center; padding: 30px 0; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>
  🏋️ 운동 기록
  <span class="tools">
    <button class="advice-btn" onclick="openAdvice()">✨ 조언</button>
    <button class="icon-btn" onclick="openMenu()">⋯</button>
  </span>
</h1>

<div id="update-bar"><span>새 버전이 있습니다</span><button onclick="applyUpdate()">🔄 업데이트</button></div>
<div id="storage-warn"></div>

<div class="cal">
  <div class="cal-head">
    <button onclick="moveMonth(-1)">‹</button>
    <span class="title" id="cal-title"></span>
    <button onclick="moveMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="day-head">
  <span class="d"><span id="day-title"></span><span class="sess" id="sess-time"></span></span>
  <span class="actions">
    <button class="btn-copy" onclick="openCopyModal()">복사</button>
    <button class="btn-del" onclick="clearDay()">비우기</button>
  </span>
</div>

<div id="routine"></div>
<div class="tpl-row">
  <button onclick="applyTemplate('lower')">🦵 하체 루틴<span class="sub">톱 95 + 백오프</span></button>
  <button onclick="applyTemplate('upper')">💪 상체 루틴<span class="sub">톱 62.5 + 백오프</span></button>
  <button onclick="applyTemplate('zone2')">🏃 존2 러닝<span class="sub">30분</span></button>
</div>
<button class="add-ex" onclick="openExModal()">＋ 운동 추가</button>
<button class="finish-btn" id="finish-btn" onclick="finishWorkout()">✅ 오늘 운동 완료</button>

<div id="timerbar">
  <div class="prog" id="timer-prog"></div>
  <div>
    <div class="lbl" id="timer-lbl">휴식</div>
    <div class="t" id="timer-txt">0:00</div>
  </div>
  <button onclick="adjustTimer(-15)">-15초</button>
  <button onclick="adjustTimer(15)">+15초</button>
  <button onclick="stopTimer()">건너뛰기</button>
</div>

<div class="modal-bg" id="copy-modal">
  <div class="modal">
    <h3>루틴 복사</h3>
    <div class="hint" id="copy-src"></div>
    <div style="margin-top:10px"><input type="date" id="copy-date"></div>
    <div class="hint">복사 시 세트 완료 표시는 초기화되고 무게/횟수는 유지됩니다.</div>
    <div class="row">
      <button onclick="closeModal('copy-modal')">취소</button>
      <button class="primary" onclick="doCopy()">복사하기</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="ex-modal">
  <div class="modal">
    <h3>운동 추가</h3>
    <input type="text" id="ex-name-input" placeholder="운동 이름 입력 · 아래 목록 검색">
    <div class="preset-list" id="preset-list"></div>
    <div class="row">
      <button onclick="closeModal('ex-modal')">취소</button>
      <button class="primary" onclick="addExercise()">추가</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="rest-modal">
  <div class="modal">
    <h3>세트 간 휴식 시간</h3>
    <div class="rest-opts" id="rest-opts"></div>
    <div class="row"><button onclick="closeModal('rest-modal')">닫기</button></div>
  </div>
</div>

<div class="modal-bg" id="menu-modal">
  <div class="modal">
    <h3>기타</h3>
    <div class="menu-list">
      <button onclick="closeModal('menu-modal'); copySummary()">📋 기록 텍스트 복사</button>
      <button onclick="closeModal('menu-modal'); exportData()">💾 백업 파일 저장</button>
      <button onclick="closeModal('menu-modal'); importData()">📂 백업 파일에서 복원</button>
      <button onclick="closeModal('menu-modal'); checkUpdate(true)">🔄 업데이트 확인 <span id="menu-ver" style="opacity:.55;font-weight:600"></span></button>
    </div>
    <div class="row"><button onclick="closeModal('menu-modal')">닫기</button></div>
  </div>
</div>

<div class="modal-bg" id="hist-modal">
  <div class="modal">
    <h3 id="hist-title">📈 이전 기록</h3>
    <div id="hist-body"></div>
    <div class="row"><button onclick="closeModal('hist-modal')">닫기</button></div>
  </div>
</div>

<div class="modal-bg" id="finish-modal">
  <div class="modal">
    <h3>💪 오늘 운동 완료</h3>
    <div class="finish-stat" id="finish-stat"></div>
    <div class="hint" id="finish-hint"></div>
    <div class="row">
      <button onclick="closeModal('finish-modal')">닫기</button>
      <button class="primary" onclick="copySummary()">📋 다시 복사</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="advice-modal">
  <div class="modal">
    <h3>✨ 루틴 조언</h3>
    <div id="advice-body"></div>
    <div class="row">
      <button onclick="closeModal('advice-modal')">닫기</button>
      <button class="primary" id="advice-refresh" onclick="runAdvice()">다시 분석</button>
    </div>
  </div>
</div>

<div id="ver-bar" onclick="checkUpdate(true)">
  <span id="ver-txt">v—</span><span id="ver-state">확인 중…</span>
</div>

<script>
'use strict';
const KEY = 'workout-tracker-v1';
const SKIP_KEY = 'workout-tracker-skip';  /* 사용자가 비운 날짜 — SEED가 되살리지 않는다 */
const BUILD = '2026-09-11.1';  /* 배포할 때마다 올린다 — 캐시 감지용 */
const PRESET_GROUPS = [
  ['🦵 하체', ['백스쿼트','고블릿 스쿼트','레그프레스','레그컬','레그익스텐션','루마니안 데드리프트','데드리프트','런지','덤벨런지','힙쓰러스트','힙 어브덕션','카프레이즈']],
  ['🫁 가슴', ['벤치프레스','인클라인 벤치프레스','팩덱 플라이','케이블 크로스오버','딥스']],
  ['🔙 등',   ['랫풀다운','시티드 로우','어시스트 풀업','풀업','바벨로우']],
  ['🎯 어깨', ['숄더프레스','오버헤드프레스','레터럴레이즈','리버스 팩덱','페이스풀']],
  ['💪 팔',   ['이지바 컬','덤벨컬','해머컬','케이블 푸시다운']],
  ['🧱 코어', ['크런치','플랭크']],
  ['🏃 유산소', ['존2 러닝 (횟수=분)','존2 러닝 마무리 (횟수=분)','자전거 출근 (횟수=분)','자전거 퇴근 (횟수=분)','러닝머신','로잉머신','싸이클']]
];
const PRESETS = PRESET_GROUPS.flatMap(g => g[1]);
const REST_CHOICES = [30,45,60,90,120,150,180,240,300];

/* ---------- user profile (2026.08) ---------- */
const PROFILE = `[사용자 운동 프로필 2026.08]
목표: ①체지방 감량·유지(복부 최소화, 무리한 감량 X) ②하체·가슴·등·어깨 위주 균형 근성장(팔은 보조) ③기능적인 몸(자세·체력·골프에 도움) ④존2 러닝으로 심폐지구력 향상.
우선순위: 건강>체력>근력>근육량>체형. 평생 지속 가능한 루틴 지향.
스케줄: 주 3~4회 운동, 1회 50분~1시간. 근력 주 1~2회(하체/상체) + 존2 유산소 주 2회 30분. 예: 화 상체, 목 존2 30분, 토 하체, 일 존2 30분 (상황에 따라 유동적). 조언 시 한 세션이 50~60분 안에 끝나도록 운동 수·세트를 구성할 것.
기준 수치: 백스쿼트 2026-08-28에 102kg×5 수행, 추정 1RM 약 115kg. 벤치프레스 60kg×5를 작업세트 3개로 수행(2026-08-25), 추정 1RM 약 67.5kg. 레그프레스 120×10, 레그컬 40.5×12, 랫풀다운 36×10×3, 숄더프레스 34×10×3. 데드리프트는 스쿼트와 같은 날 보조로만 다루며 무겁게 가지 않는다(허리 피로 회피) — 루마니안 데드리프트 70×8×3로 대체.
프로그램 구조: 사용자는 고중량 저반복을 선호하므로 '톱세트 1개 + 백오프 3세트'로 짤 것. 하체=톱 102×5 + 백오프 87.5×6×3, 상체=톱 62.5×5 + 백오프 55×8×3. 톱세트는 격주로만 최대로 가고 사이 주는 백오프 위주. 다음 목표: 스쿼트 톱 105×5, 벤치 톱 65×5.
조언 시 유의: 2026-08-28부터 감량기(칼로리 적자). 회복력이 떨어지므로 고중량 저반복만 반복하지 말고 백오프 볼륨을 확보할 것. 세트 완료율과 소요시간을 보고 증량 판단.
증량 원칙: 복합운동 RPE 7~8(2~3회 여유), 고립운동 RPE 8~9. 무게보다 자세·동작 완성도 우선, 점진적 과부하.
존2 러닝: 현재 주 2회 30분씩 수행. 속도보다 심박(존3 진입 시 감속/걷기). 과거 기록 60분 6.69km 평균 133bpm 최고 150bpm. 장기적으로 동일 심박에서 페이스 향상(60분 기준 7.0 → 7.3 → 7.5km 페이스) 목표.
추가 예정: 페이스풀 15×3 (후면삼각근·견갑 안정화).
영양: 2026-08-28 인바디 기준 체중 73.8kg / 체지방률 20.6% / 골격근량 33.3kg. 목표는 체지방률 18%(체중 약 71.5kg) — 체지방 -2.3kg, 주 0.3kg 페이스로 7~9주. 하루 300~350kcal 적자, 단백질 118~148g/일. 감량기에도 근력운동은 줄이지 않는다(골격근 33.3kg 유지가 최우선). 운동 직후 단백질 쉐이크 → 저녁식사. 패스트푸드 최소화.`;

/* 저장소가 막힌 환경(파일 미리보기 등)에서도 앱이 죽지 않도록 감싼다 */
let storageOK = true;
const memStore = {};
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch(e) { storageOK = false; return memStore[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e) { storageOK = false; memStore[k] = v; } }
};
function getSkip() {
  try { return JSON.parse(LS.get(SKIP_KEY)) || []; } catch(e) { return []; }
}
function addSkip(ds) {
  const sk = getSkip();
  if (!sk.includes(ds)) { sk.push(ds); LS.set(SKIP_KEY, JSON.stringify(sk)); }
}
function load() {
  const raw = LS.get(KEY);
  let parsed = null, broken = false;
  if (raw) { try { parsed = JSON.parse(raw); } catch(e) { broken = true; } }
  if (broken) {
    /* 저장된 데이터가 깨졌으면 절대 덮어쓰지 않는다 — 백업 기회를 준다 */
    data = {};
    setTimeout(() => alert('저장된 기록을 읽지 못했습니다.\n덮어쓰지 않았으니, 다른 기기의 백업으로 복원하세요.'), 300);
    return;
  }
  data = parsed || {};
  const skip = getSkip();
  let seeded = false;
  Object.entries(SEED).forEach(([ds, day]) => {
    if (skip.includes(ds)) return;   /* 사용자가 지운 날은 되살리지 않음 */
    const cur = data[ds];
    const empty = !cur || !cur.exercises || !cur.exercises.length;
    /* 아직 한 세트도 완료하지 않은 '예정' 날짜는 최신 계획으로 갱신한다.
       완료 표시(✓)가 하나라도 있으면 실제 기록이므로 절대 건드리지 않는다. */
    const untouched = !empty && !cur.exercises.some(e => e.sets.some(s => s.done)) && !cur.startedAt;
    const seedDone = day.exercises.some(e => e.sets.some(s => s.done));
    if (empty || (untouched && !seedDone)) {
      data[ds] = JSON.parse(JSON.stringify(day));
      seeded = true;
    } else if (untouched && seedDone) {
      data[ds] = JSON.parse(JSON.stringify(day));
      seeded = true;
    }
  });
  if (seeded) LS.set(KEY, JSON.stringify(data));
}
function save() { LS.set(KEY, JSON.stringify(data)); renderCalendar(); }
function fmt(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function todayStr() { const t = new Date(); return fmt(t.getFullYear(), t.getMonth(), t.getDate()); }

/* ---------- calendar ---------- */
function renderCalendar() {
  document.getElementById('cal-title').textContent = `${viewYear}년 ${viewMonth+1}월`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach((d,i)=>{
    const el = document.createElement('div');
    el.className = 'dow' + (i===0?' sun':i===6?' sat':'');
    el.textContent = d;
    grid.appendChild(el);
  });
  const start = new Date(viewYear, viewMonth, 1).getDay();
  const dim = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevDim = new Date(viewYear, viewMonth, 0).getDate();
  const today = todayStr();
  const totalCells = Math.ceil((start + dim) / 7) * 7;
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('button');
    cell.className = 'day';
    let y = viewYear, m = viewMonth, d;
    if (i < start) { d = prevDim - start + 1 + i; m--; if (m<0){m=11;y--;} cell.classList.add('other'); }
    else if (i >= start + dim) { d = i - start - dim + 1; m++; if (m>11){m=0;y++;} cell.classList.add('other'); }
    else d = i - start + 1;
    const ds = fmt(y,m,d);
    cell.textContent = d;
    if (ds === today) cell.classList.add('today');
    if (ds === selDate) cell.classList.add('sel');
    const day = data[ds];
    if (day && day.exercises.length) {
      const sets = day.exercises.flatMap(e=>e.sets);
      const done = sets.length && sets.every(s=>s.done);
      cell.classList.add(done ? 'done-all' : 'done-part');
      const dot = document.createElement('span');
      dot.className = 'dot';
      cell.appendChild(dot);
    }
    cell.onclick = () => selectDate(ds);
    grid.appendChild(cell);
  }
}
function moveMonth(dir) {
  viewMonth += dir;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}
function selectDate(ds) {
  selDate = ds;
  const [y,m] = ds.split('-').map(Number);
  viewYear = y; viewMonth = m-1;
  renderCalendar();
  renderRoutine();
}

/* ---------- routine ---------- */

}

    const down = mkBtn('↓', () => { if(ei<day.exercises.length-1){ [day.exercises[ei+1],day.exercises[ei]]=[day.exercises[ei],day.exercises[ei+1]]; save(); renderRoutine(); } });
    const del = mkBtn('✕', () => { if(confirm(`'${ex.name}' 삭제할까요?`)){ day.exercises.splice(ei,1); save(); renderRoutine(); } });
    del.style.color = 'var(--red)';
    tools.append(restBtn, up, down, del);

    card.appendChild(head);

    const table = document.createElement('table');

      const tdR = document.createElement('td'); tdR.appendChild(mkNum(s.r, v => { s.r = v; save(); }));
      const tdC = document.createElement('td');
      const chk = document.createElement('button');
      chk.className = 'chk' + (s.done ? ' on' : '');
      chk.textContent = '✓';
      chk.onclick = () => {
        s.done = !s.done;
        if (s.done && !day.startedAt) day.startedAt = Date.now();

      tr.append(tdN, tdW, tdR, tdC);
      table.appendChild(tr);
    });

      ex.sets.push({ w: last ? last.w : 0, r: last ? last.r : 10, done: false });

    };

    delSet.onclick = () => { ex.sets.pop(); save(); renderRoutine(); };

    const histBtn = document.createElement('button');
    histBtn.className = 'hist-btn';
    histBtn.textContent = '📈 기록';

    const formBtn = document.createElement('button');
    formBtn.className = 'form-btn';
    formBtn.textContent = '🎥 자세';
    formBtn.onclick = () => openForm(ex.name);

    actions.append(addSet, delSet, histBtn, formBtn);
    card.appendChild(actions);
    box.appendChild(card);
  });
}
function mkBtn(txt, fn) { const b = document.createElement('button'); b.textContent = txt; b.onclick = fn; return b; }
function mkNum(val, onchange) {
  const i = document.createElement('input');
  i.type = 'number'; i.min = 0; i.step = 'any'; i.value = val;
  i.onchange = () => onchange(parseFloat(i.value) || 0);
  i.onfocus = () => i.select();
  return i;
}
function fmtSec(s) { return s >= 60 ? `${Math.floor(s/60)}분${s%60 ? ' '+s%60+'초' : ''}` : `${s}초`; }

/* ---------- rest timer ---------- */
/* 휴식 타이머 — 남은 시간은 '끝나는 시각'으로 계산한다.
   화면을 벗어나 있어도(백그라운드 스로틀링) 돌아왔을 때 시간이 정확하다. */
let timerId = null, endAt = 0, total = 0, timerLbl = '';
function startTimer(sec, exName, setNum) {
  stopTimer();
  total = sec;
  endAt = Date.now() + sec * 1000;
  timerLbl = `${exName} · ${setNum}세트 완료 — 휴식`;
  const bar = document.getElementById('timerbar');
  bar.classList.remove('rest-done');
  bar.classList.add('show');
  document.getElementById('timer-lbl').textContent = timerLbl;
  tick();
  timerId = setInterval(tick, 500);
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
}
function remainSec() { return Math.max(0, Math.round((endAt - Date.now()) / 1000)); }
function tick() {
  const remain = remainSec();
  document.getElementById('timer-txt').textContent = `${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}`;
  document.getElementById('timer-prog').style.width = (total ? (remain/total*100) : 0) + '%';
  if (remain <= 0) finishTimer();
}
function adjustTimer(d) {
  if (!timerId && !document.getElementById('timerbar').classList.contains('show')) return;
  endAt = Math.max(Date.now(), endAt + d * 1000);
  total = Math.max(total, remainSec());
  if (!timerId) { document.getElementById('timerbar').classList.remove('rest-done'); timerId = setInterval(tick, 500); }
  document.getElementById('timer-lbl').textContent = timerLbl;
  tick();
}
function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
  const bar = document.getElementById('timerbar');
  bar.classList.remove('show', 'rest-done');
}
function finishTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
  const bar = document.getElementById('timerbar');
  bar.classList.add('rest-done');
  document.getElementById('timer-lbl').textContent = '휴식 완료 — 다음 세트!';
  document.getElementById('timer-txt').textContent = '0:00';
  document.getElementById('timer-prog').style.width = '0%';
  beep();
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
}
/* 다른 앱/탭을 보다 돌아오면 즉시 시간 재계산 */
document.addEventListener('visibilitychange', () => { if (!document.hidden && timerId) tick(); });
window.addEventListener('focus', () => { if (timerId) tick(); });
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .3, .6].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(.4, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .25);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .25);
    });
  } catch(e) {}
}

/* ---------- AI advice ---------- */
function recentHistory(weeks) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - weeks * 7);
  const out = {};
  Object.keys(data).sort().forEach(ds => {
    if (new Date(ds) >= cutoff && data[ds].exercises.length) out[ds] = data[ds];
  });
  return out;
}
function openAdvice() {
  document.getElementById('advice-modal').classList.add('show');
  runAdvice();
}
async function runAdvice() {
  const body = document.getElementById('advice-body');
  const hist = recentHistory(8);
  if (!Object.keys(hist).length) {
    body.className = '';
    body.textContent = '최근 8주간 기록이 없습니다. 운동을 기록한 뒤 다시 시도해 주세요.';
    return;
  }
  if (!(window.cowork && window.cowork.askClaude)) {
    body.className = '';
    body.textContent = '이 버튼은 Claude 데스크톱 앱의 아티팩트로 열었을 때만 동작합니다.\n\n폰에서는 상단 📋 복사 버튼으로 기록을 복사한 뒤 Claude 대화에 붙여넣으면 같은 분석을 받을 수 있습니다.';
    return;
  }
  body.className = 'loading';
  body.innerHTML = '<span class="spinner"></span>기록을 분석하는 중...';
  document.getElementById('advice-refresh').disabled = true;
  try {
    const summary = Object.entries(hist).map(([ds, day]) =>
      ds + ': ' + day.exercises.map(e =>
        `${e.name} ${e.sets.map(s => `${s.w}kg×${s.r}${s.done?'✓':'✗'}`).join(', ')}`
      ).join(' | ')
    ).join('\n');
    const prompt = `당신은 경험 많은 퍼스널 트레이너입니다. 아래에 사용자의 운동 프로필과 최근 8주 운동 기록(✓=완료한 세트, ✗=미완료 세트)이 있습니다. 반드시 프로필의 목표·우선순위·증량 원칙(RPE)·목표 중량 로드맵에 맞춰서 한국어로 간결하게 분석해 주세요:
1. 프로필 대비 실제 훈련 빈도·분할 평가 (근력 주2회 + 존2 주2~3회 계획 대비)
2. 목표 중량 로드맵 대비 진행 상황 (스쿼트/벤치/데드 등)
3. 개선할 점 (정체된 무게, 미완료가 잦은 운동, 부족한 부위/유산소)
4. 다음 주 구체적 제안 (증량할 운동과 권장 무게 — 프로필의 다음 단계 목표와 RPE 원칙 기준)
불필요한 서론 없이 바로 내용으로 시작하고, 마크다운 기호 없이 일반 텍스트로 답하세요.

${PROFILE}

오늘 날짜: ${todayStr()}
운동 기록:
${summary}`;
    const res = await window.cowork.askClaude(prompt, []);
    let text = typeof res === 'string' ? res
      : (res && (res.text || res.content || res.result)) || JSON.stringify(res);
    body.className = '';
    body.textContent = text;
  } catch (e) {
    body.className = '';
    body.textContent = '분석 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e);
  } finally {
    document.getElementById('advice-refresh').disabled = false;
  }
}

/* ---------- copy summary for pasting into Claude ---------- */
function summaryText(days) {
  return Object.entries(days).map(([ds, day]) => {
    const mins = elapsedMin(day);
    const meta = mins !== null ? ` (${mins}분${day.endedAt ? '' : ', 진행중'})` : '';
    return ds + meta + ': ' + day.exercises.map(e =>
      `${e.name} ${e.sets.map(s => `${s.w}kg×${s.r}${s.done ? '✓' : '✗'}`).join(', ')}`
    ).join(' | ');
  }).join('\n');
}
function copySummary(quiet) {
  const day = data[selDate];
  let scope, txt;
  if (day && day.exercises.length) {
    scope = selDate + ' 기록';
    txt = summaryText({ [selDate]: day });
  } else {
    const hist = recentHistory(4);
    if (!Object.keys(hist).length) { alert('복사할 기록이 없습니다.'); return; }
    scope = '최근 4주 기록';
    txt = summaryText(hist);
  }
  const full = `[운동 기록 — ${scope}] (✓=완료, ✗=미완료)\n${txt}`;
  const done = () => { if (!quiet) toast('📋 복사됨 — Claude 대화에 붙여넣으세요'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(full).then(done, () => fallbackCopy(full, done));
  } else fallbackCopy(full, done);
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
  try { document.execCommand('copy'); done(); }
  catch (e) { prompt('아래 내용을 길게 눌러 복사하세요:', txt); }
  ta.remove();
}

/* ---------- 자세 영상 (유튜브 검색) ---------- */
const FORM_QUERY = {
  '백스쿼트': '백스쿼트 자세',
  '고블릿 스쿼트': '고블릿 스쿼트 자세',
  '루마니안 데드리프트': '루마니안 데드리프트 자세 RDL',
  '데드리프트': '데드리프트 자세',
  '레그프레스': '레그프레스 자세',
  '레그컬': '레그컬 자세',
  '레그익스텐션': '레그익스텐션 자세',
  '덤벨런지': '덤벨 런지 자세',
  '힙 어브덕션': '힙 어브덕션 머신 자세',
  '벤치프레스': '벤치프레스 자세',
  '인클라인 벤치프레스': '인클라인 벤치프레스 자세',
  '팩덱 플라이': '펙덱 플라이 자세',
  '리버스 팩덱': '리버스 펙덱 후면삼각근 자세',
  '랫풀다운': '랫풀다운 자세',
  '시티드 로우': '시티드 로우 자세',
  '어시스트 풀업': '어시스트 풀업 머신 자세',
  '숄더프레스': '숄더프레스 자세',
  '레터럴레이즈': '사이드 레터럴 레이즈 자세',
  '페이스풀': '페이스풀 자세',
  '이지바 컬': '이지바 컬 자세',
  '케이블 푸시다운': '케이블 푸시다운 자세'
};
function openForm(name) {
  const key = norm(name);
  /* 유산소·이동 종목은 자세 영상이 의미 없음 */
  if (/러닝|자전거|사이클|싸이클|로잉|워킹|걷기/.test(key)) {
    toast('유산소 종목은 자세 영상이 없습니다');
    return;
  }
  let q = null;
  for (const k in FORM_QUERY) { if (norm(k) === key) { q = FORM_QUERY[k]; break; } }
  if (!q) q = (name || '').replace(/\([^)]*\)/g, '').trim() + ' 자세';
  window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(q), '_blank');
}

/* ---------- 운동별 이전 기록 ---------- */
let histTargetIdx = null;

function setsText(sets) {
  return sets.map(x => `${x.w}kg×${x.r}${x.done ? '✓' : '✗'}`).join(', ');
}
function topSet(sets) {
  const done = sets.filter(x => x.done);
  const pool = done.length ? done : sets;
  return pool.reduce((a, x) => (x.w > a.w ? x : a), pool[0] || { w: 0, r: 0 });
}
/* 이름이 조금씩 달라도(이지바컬 / 이지바 컬) 같은 운동으로 묶는다.
   - 공백·대소문자·괄호설명 제거
   - 아래 별칭표에 있는 표기는 대표 이름으로 통일 */
const ALIASES = {
  '백스쿼트': ['스쿼트','바벨스쿼트','back squat'],
  '벤치프레스': ['벤치','플랫벤치','바벨벤치프레스','bench press'],
  '인클라인벤치프레스': ['인클라인벤치','인클라인프레스'],
  '랫풀다운': ['랫풀','lat pulldown'],
  '시티드로우': ['시티드케이블로우','케이블로우','seated row'],
  '어시스트풀업': ['어시스티드풀업','보조풀업','풀업보조','어시스트턱걸이'],
  '숄더프레스': ['덤벨숄더프레스','머신숄더프레스','shoulder press'],
  '레터럴레이즈': ['사이드레터럴레이즈','사이드레터럴','래터럴레이즈','lateral raise'],
  '팩덱플라이': ['펙덱플라이','팩덱','펙덱','체스트플라이','버터플라이'],
  '이지바컬': ['이지컬','ez바컬','ez컬'],
  '케이블푸시다운': ['푸시다운','트라이셉스푸시다운'],
  '레그익스텐션': ['레그익스'],
  '힙어브덕션': ['아웃타이','힙아브덕션'],
  '존2러닝': ['존2','zone2','존2런','트레드밀존2'],
  '자전거출근': ['자전거출근길','출근라이딩'],
  '자전거퇴근': ['자전거퇴근길','퇴근라이딩']
};
const ALIAS_MAP = (() => {
  const m = {};
  Object.keys(ALIASES).forEach(canon => {
    m[canon] = canon;
    ALIASES[canon].forEach(v => { m[v.replace(/\s+/g, '').toLowerCase()] = canon; });
  });
  return m;
})();
function norm(x) {
  let n = (x || '')
    .replace(/\([^)]*\)/g, '')        // (횟수=분) 같은 설명 제거
    .replace(/마무리|중량|머신$/g, '')  // '존2 러닝 마무리' → '존2 러닝'
    .replace(/\s+/g, '')
    .toLowerCase()
    .trim();
  return ALIAS_MAP[n] || n;
}
function exerciseHistory(name, limit) {
  limit = limit || 10;
  const target = norm(name);
  if (!target) return [];
  const out = [];
  const keys = Object.keys(data).sort().reverse();
  for (const ds of keys) {
    if (ds === selDate) continue;
    const day = data[ds];
    if (!day || !day.exercises || !day.exercises.length) continue;
    let exact = null, similar = null;
    for (const e of day.exercises) {
      if (!e.sets || !e.sets.length) continue;
      const n = norm(e.name);
      if (n === target) { exact = e; break; }
      if (!similar && n && (n.includes(target) || target.includes(n))) similar = e;
    }
    const hit = exact || similar;
    if (hit) out.push({ ds: ds, ex: hit, exact: !!exact });
    if (out.length >= limit) break;
  }
  return out;
}
function openHistory(ei) {
  const day = data[selDate];
  const ex = day && day.exercises[ei];
  if (!ex) return;
  histTargetIdx = ei;
  document.getElementById('hist-title').textContent = `📈 ${ex.name}`;
  const body = document.getElementById('hist-body');
  const hist = exerciseHistory(ex.name);
  if (!hist.length) {
    body.innerHTML = '<div class="hint">이 운동의 이전 기록이 없습니다.<br>오늘이 첫 기록입니다.</div>';
    document.getElementById('hist-modal').classList.add('show');
    return;
  }
  const exactOnly = hist.filter(h => h.exact);
  const base = exactOnly.length ? exactOnly : hist;
  const best = base.reduce((a, h) => {
    const t = topSet(h.ex.sets);
    return t.w > a.w ? { w: t.w, r: t.r, ds: h.ds } : a;
  }, { w: 0, r: 0, ds: '' });
  const last = topSet(base[0].ex.sets);
  const cur = topSet(ex.sets);
  let head = `최고 기록 <b>${best.w}kg × ${best.r}</b>`;
  if (best.ds) head += ` <span class="hist-meta">(${best.ds})</span>`;
  head += `<br>직전 세션 최고 <b>${last.w}kg × ${last.r}</b>`;
  if (cur.w > last.w) head += ` → 오늘 <span style="color:var(--green);font-weight:700">${cur.w}kg</span> ⬆`;
  body.innerHTML = `<div class="hist-best">${head}</div>`;

  hist.forEach((h, i) => {
    const [y, m, d] = h.ds.split('-').map(Number);
    const dow = ['일','월','화','수','목','금','토'][new Date(y, m - 1, d).getDay()];
    const mins = elapsedMin(data[h.ds]);
    const item = document.createElement('div');
    item.className = 'hist-item';
    const head2 = document.createElement('div');
    head2.className = 'hist-head';
    const dt = document.createElement('span');
    dt.className = 'hist-date';
    dt.innerHTML = `${m}월 ${d}일 (${dow})` +
      `<span class="hist-meta">${h.ex.sets.length}세트${mins ? ' · ' + mins + '분' : ''}` +
      `${h.exact ? '' : ' · ' + h.ex.name}</span>`;
    const load = document.createElement('button');
    load.className = 'hist-load';
    load.textContent = '불러오기';
    load.onclick = () => loadHistory(i);
    head2.append(dt, load);
    const sets = document.createElement('div');
    sets.className = 'hist-sets';
    sets.textContent = setsText(h.ex.sets);
    item.append(head2, sets);
    body.appendChild(item);
  });
  histCache = hist;
  document.getElementById('hist-modal').classList.add('show');
}
let histCache = [];
function loadHistory(i) {
  const h = histCache[i];
  const day = data[selDate];
  const ex = day && day.exercises[histTargetIdx];
  if (!h || !ex) return;
  if (!confirm(`${h.ds} 기록을 오늘 세트로 불러올까요?\n(현재 입력값은 대체되고 완료 표시는 초기화됩니다)`)) return;
  ex.sets = h.ex.sets.map(x => ({ w: x.w, r: x.r, done: false }));
  save(); renderRoutine();
  closeModal('hist-modal');
  toast('📈 기록을 불러왔습니다');
}

/* ---------- 운동 시간 ---------- */
function elapsedMin(day) {
  if (!day || !day.startedAt) return null;
  const end = day.endedAt || Date.now();
  return Math.max(1, Math.round((end - day.startedAt) / 60000));
}
function renderSessionTime() {
  const el = document.getElementById('sess-time');
  if (!el) return;
  const day = data[selDate];
  const mins = elapsedMin(day);
  if (mins === null) { el.className = 'sess'; el.textContent = ''; return; }
  if (day.endedAt) {
    el.className = 'sess show done';
    el.textContent = `✅ ${mins}분`;
  } else {
    el.className = 'sess show live';
    el.textContent = `🕒 운동 중 ${mins}분`;
  }
}
setInterval(renderSessionTime, 20000);

/* ---------- 운동 완료 ---------- */
function openMenu() {
  const mv = document.getElementById('menu-ver'); if (mv) mv.textContent = 'v' + BUILD; document.getElementById('menu-modal').classList.add('show'); }

function finishWorkout() {
  const day = data[selDate];
  if (!day || !day.exercises.length) { alert('이 날에 기록된 운동이 없습니다.'); return; }
  const sets = day.exercises.flatMap(e => e.sets);
  const doneSets = sets.filter(s => s.done);
  if (!doneSets.length) { alert('완료 체크한 세트가 하나도 없습니다.'); return; }
  const undone = sets.length - doneSets.length;
  if (undone && !confirm(`아직 체크하지 않은 세트가 ${undone}개 있습니다.\n그대로 오늘 운동을 마칠까요?`)) return;

  stopTimer();
  day.endedAt = Date.now();
  if (!day.startedAt) day.startedAt = day.endedAt;
  save(); renderRoutine();

  const mins = Math.max(1, Math.round((day.endedAt - day.startedAt) / 60000));
  const vol = Math.round(doneSets.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0));
  document.getElementById('finish-stat').innerHTML =
    `<div><div class="n">${doneSets.length}</div><div class="l">완료 세트</div></div>` +
    `<div><div class="n">${mins}</div><div class="l">소요 시간(분)</div></div>` +
    (vol > 0 ? `<div><div class="n">${vol.toLocaleString()}</div><div class="l">총 볼륨(kg)</div></div>` : '');
  document.getElementById('finish-hint').innerHTML =
    '📋 오늘 기록을 <b>클립보드에 복사했습니다.</b><br>' +
    'Claude 대화창에 그대로 <b>붙여넣기</b> 하시면 기록을 반영하고 다음 루틴을 잡아줍니다.' +
    (undone ? `<br><br>※ 미완료 세트 ${undone}개는 ✗로 기록에 남습니다.` : '');
  document.getElementById('finish-modal').classList.add('show');
  copySummary(true);
}

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `workout-${selDate || todayStr()}.json`;
  a.click();
}
function importData() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (typeof d !== 'object' || d === null) throw 0;
        if (confirm('현재 데이터를 백업 파일로 교체할까요?')) { data = d; save(); renderRoutine(); }
      } catch(e) { alert('올바른 백업 파일이 아닙니다.'); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ---------- 버전 확인 (캐시된 구버전 자동 감지) ---------- */
let newBuild = null;
function setVer(state, cls) {
  const t = document.getElementById('ver-txt'), s = document.getElementById('ver-state');
  if (t) t.textContent = 'v' + BUILD;
  if (s) { s.textContent = state; s.className = cls || ''; }
}
async function checkUpdate(manual) {
  setVer('확인 중…', '');
  try {
    const res = await fetch(location.pathname + '?cb=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch failed');
    const txt = await res.text();
    const m = txt.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) {
      newBuild = m[1];
      setVer('새 버전 v' + m[1], 'new');
      document.getElementById('update-bar').classList.add('show');
      if (manual) applyUpdate();
      return true;
    }
    setVer('최신 ✓', 'ok');
    if (manual) toast('최신 버전입니다 (v' + BUILD + ')');
    return false;
  } catch (e) {
    setVer('확인 실패 · 탭하면 재시도', '');
    if (manual) toast('업데이트 확인 실패 — 네트워크를 확인하세요');
    return false;
  }
}
function applyUpdate() {
  location.replace(location.pathname + '?v=' + (newBuild || Date.now()));
}

/* ---------- 오프라인 캐시 등록 ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('offline cache ready'))
      .catch(err => console.log('sw register failed', err));
  });
}

/* ---------- init ---------- */
load();
const now = new Date();
viewYear = now.getFullYear(); viewMonth = now.getMonth();
selDate = todayStr();
checkStorage();
renderCalendar();
renderRoutine();
setVer('확인 중…', '');
setTimeout(() => checkUpdate(false), 800);
console.log('workout-tracker artifact loaded, days with data:', Object.keys(data).length);
</script>
